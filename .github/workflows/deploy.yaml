name: Build and Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      fetch:
        description: Fetch the payload from booktrack first
        type: boolean
        default: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Make vite use this as base for all links in the index.html
  BASE_URL: https://readlog.derlin.ch

jobs:
  build:
    runs-on: ubuntu-latest
    # Write: the fetch step commits the payload.
    permissions:
      contents: write
    # Per branch: this job runs on every push, so it must not share a queue with
    # the deployment below. Superseded builds of the same branch are worth
    # cancelling — only the newest commit is ever deployed or worth checking.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # A push with GITHUB_TOKEN starts no workflow, so this same run builds and
      # deploys the fetched payload.
      - name: Fetch the payload from booktrack
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.fetch }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail-with-body -sS -o "$RUNNER_TEMP/payload.json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://booktrack.derlin.ch/api/public/readlog.json
          node scripts/validate-payload.ts "$RUNNER_TEMP/payload.json"
          cp "$RUNNER_TEMP/payload.json" src/data/payload.json
          git add src/data/payload.json
          if git diff --cached --quiet; then
            echo "payload unchanged"
          else
            git config user.name "readlog-bot"
            git config user.email "readlog-bot@users.noreply.github.com"
            git commit -m "chore(ci): update payload.json"
            git push
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        if: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    # Only one deployment at a time, skipping anything queued between the run
    # in-progress and the latest queued one. In-progress runs are never
    # cancelled: a production deployment must be allowed to finish.
    #
    # This belongs to the job and not to the workflow. At workflow level the
    # group covered every push to every branch, so a push to a feature branch
    # could take the slot from, or cancel, a queued deployment of main.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
